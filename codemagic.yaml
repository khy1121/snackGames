workflows:
  ios-workflow:
    name: iOS Release Build
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Pod install
        script: |
          find . -name "Podfile" -exec cd ios && pod install \;
      - name: Build iOS
        script: |
          flutter build ipa --release --export-options-plist=/usr/local/share/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - *.dSYM.zip
    publishing:
      app_store_connect:
        auth: integration  # Use API Key connected in Codemagic UI
        submit_to_testflight: true  # Auto-upload to TestFlight
        beta_groups: # Optional: Add TestFlight groups here
          - "Testers"
      email:
        recipients:
          - user@example.com # Update this in Codemagic UI
