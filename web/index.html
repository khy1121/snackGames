<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="배수의 법칙과 합쳐라! 주사위 - 프리미엄 미니 게임 컬렉션. 오프라인에서도 즐길 수 있는 중독성 있는 퍼즐 게임!">

  <!-- PWA Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="스넥게임즈">
  <meta name="theme-color" content="#2E5940">

  <!-- iOS Icons -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>스넥게임즈 - 배수의 법칙 & 합쳐라! 주사위</title>
  <link rel="manifest" href="manifest.json">
</head>

<body>
  <!-- PWA Update Toast Notification -->
  <style>
    .pwa-update-toast {
      position: fixed;
      bottom: -100px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #2E5940 0%, #1a3528 100%);
      color: white;
      padding: 16px 24px;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      z-index: 999999;
      display: flex;
      align-items: center;
      gap: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      transition: bottom 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      max-width: 90vw;
    }

    .pwa-update-toast.show {
      bottom: 24px;
    }

    .pwa-update-toast .toast-icon {
      font-size: 28px;
      animation: bounce 0.6s ease-in-out infinite alternate;
    }

    @keyframes bounce {
      from {
        transform: translateY(0);
      }

      to {
        transform: translateY(-4px);
      }
    }

    .pwa-update-toast .toast-content {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .pwa-update-toast .toast-title {
      font-weight: 700;
      font-size: 15px;
    }

    .pwa-update-toast .toast-message {
      font-size: 13px;
      opacity: 0.9;
    }

    .pwa-update-toast .toast-actions {
      display: flex;
      gap: 8px;
      margin-left: 8px;
    }

    .pwa-update-toast button {
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .pwa-update-toast .btn-refresh {
      background: white;
      color: #2E5940;
    }

    .pwa-update-toast .btn-refresh:hover {
      background: #f0f0f0;
      transform: scale(1.05);
    }

    .pwa-update-toast .btn-later {
      background: rgba(255, 255, 255, 0.2);
      color: white;
    }

    .pwa-update-toast .btn-later:hover {
      background: rgba(255, 255, 255, 0.3);
    }
  </style>

  <div id="pwa-update-toast" class="pwa-update-toast">
    <span class="toast-icon">🎉</span>
    <div class="toast-content">
      <span class="toast-title">업데이트 완료!</span>
      <span class="toast-message" id="toast-version-msg">새 버전이 준비되었습니다.</span>
    </div>
    <div class="toast-actions">
      <button class="btn-refresh" onclick="window.refreshForUpdate()">업데이트</button>
      <button class="btn-later" onclick="window.dismissUpdateToast()">나중에</button>
    </div>
  </div>

  <script>
    // Current SW Version
    window.currentSWVersion = '2.2.0'; // Service Worker와 동일한 버전
    
    // PWA Update Toast Functions
    window.showUpdateToast = function (version) {
      const toast = document.getElementById('pwa-update-toast');
      const versionMsg = document.getElementById('toast-version-msg');
      if (version) {
        versionMsg.textContent = `버전 ${version}이(가) 준비되었습니다.`;
      }
      toast.classList.add('show');
    };

    window.dismissUpdateToast = function () {
      const toast = document.getElementById('pwa-update-toast');
      toast.classList.remove('show');
    };

    window.refreshForUpdate = function () {
      // 업데이트 시작 - 토스트 숨기기
      window.dismissUpdateToast();
      
      // 서비스 워커에게 skipWaiting 메시지 전송
      if (navigator.serviceWorker.controller) {
        navigator.serviceWorker.controller.postMessage({ type: 'SKIP_WAITING' });
      }
      
      // 짧은 지연 후 새로고침 (서비스 워커 활성화 대기)
      setTimeout(() => {
        window.location.reload();
      }, 500);
    };

    // Register Service Worker for PWA with update detection
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((registration) => {
            console.log('ServiceWorker registration successful:', registration.scope);

            // Check for updates periodically (every 30 minutes)
            setInterval(() => {
              registration.update();
              console.log('Checking for SW updates...');
            }, 30 * 60 * 1000);

            // Detect when a new SW is waiting to activate
            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              console.log('New Service Worker found!');

              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // New SW is installed and waiting
                  console.log('New version available! Showing update toast...');
                  // Request version from new worker
                  newWorker.postMessage({ type: 'GET_VERSION' });
                  // Show toast with default message (will be updated when version received)
                  window.showUpdateToast();
                }
              });
            });
          })
          .catch((error) => {
            console.log('ServiceWorker registration failed:', error);
          });

        // Listen for messages from Service Worker
        navigator.serviceWorker.addEventListener('message', (event) => {
          if (event.data.type === 'SW_UPDATED') {
            console.log('SW Updated to version:', event.data.version);
            window.showUpdateToast(event.data.version);
          }
          if (event.data.type === 'SW_VERSION') {
            console.log('SW Version:', event.data.version);
            const versionMsg = document.getElementById('toast-version-msg');
            versionMsg.textContent = `버전 ${event.data.version}이(가) 준비되었습니다.`;
          }
        });

        // Handle controller change (when skipWaiting is called)
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing) return;
          refreshing = true;
          console.log('Service Worker controller changed - updating complete');
          
          // 업데이트 완료 - 버전 정보 갱신 요청
          if (navigator.serviceWorker.controller) {
            navigator.serviceWorker.controller.postMessage({ type: 'GET_VERSION' });
          }
          console.log('Controller changed, new SW activated');
        });
      });
    }

    // PWA Install Prompt - Global variable accessible from Flutter
    window.deferredPrompt = null;
    window.pwaInstallable = false;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.deferredPrompt = e;
      window.pwaInstallable = true;
      console.log('PWA install prompt available');

      // Dispatch custom event to notify Flutter
      window.dispatchEvent(new CustomEvent('pwa-installable'));
    });

    window.addEventListener('appinstalled', () => {
      console.log('PWA was installed');
      window.deferredPrompt = null;
      window.pwaInstallable = false;

      // Dispatch custom event to notify Flutter
      window.dispatchEvent(new CustomEvent('pwa-installed'));
    });

    // Global function to trigger PWA install
    window.installPWA = async function () {
      if (window.deferredPrompt) {
        window.deferredPrompt.prompt();
        const choiceResult = await window.deferredPrompt.userChoice;

        if (choiceResult.outcome === 'accepted') {
          console.log('User accepted the install prompt');
          window.pwaInstallable = false;
          window.deferredPrompt = null;
          return true;
        } else {
          console.log('User dismissed the install prompt');
          // 사용자가 거부했으므로 여전히 설치 가능
          return false;
        }
      }
      return false;
    };

    // Function to check if PWA is installable
    window.isPWAInstallable = function () {
      return window.pwaInstallable === true;
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
